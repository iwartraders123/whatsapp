<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WhatsApp Broadcast Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail on desktop, bottom bar on phones. One content column, teal-green on pale gray, WhatsApp-style chat preview as the signature element. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F4F7F5; --fg:#10201B; --muted:#586A63; --line:#DCE4E0;
  --brand:#0B7A62; --brand-strong:#075E4C; --brand-soft:#DDF3E8; --on-brand:#FFFFFF; --wa:#25D366;
  --wa-head:#075E54; --wa-head-fg:#FFFFFF; --bubble:#D9FDD3; --bubble-fg:#10201B; --chat-bg:#EFE7DC; --chat-dot:#E1D7C8;
  --good:#157F4A; --good-soft:#DDF3E8; --warn:#8A5700; --warn-soft:#FFEFC7; --bad:#B3261E; --bad-soft:#FCE4E1; --on-bad:#FFFFFF;
  --info:#1F5E99; --info-soft:#E1EDF9; --focus:#1A73E8;
  --seg-read:#0B7A62; --seg-delivered:#52BFA0; --seg-sent:#B5C7C0; --seg-failed:#C7473D;
  --shadow:0 1px 2px rgba(16,32,27,.06),0 6px 18px rgba(16,32,27,.05);
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1310; --surface:#111C18; --surface-2:#172420; --fg:#E7EFEB; --muted:#9BADA5; --line:#243630;
    --brand:#25C48A; --brand-strong:#4FD8A4; --brand-soft:#143328; --on-brand:#04180F;
    --wa-head:#1F2C34; --wa-head-fg:#E7EFEB; --bubble:#144D3F; --bubble-fg:#E7EFEB; --chat-bg:#0D1814; --chat-dot:#132520;
    --good:#4FD8A4; --good-soft:#143328; --warn:#F0B84A; --warn-soft:#3A2D10; --bad:#FF8A80; --bad-soft:#40201D; --on-bad:#2A0A08;
    --info:#86BDF5; --info-soft:#162B42; --focus:#8AB4F8;
    --seg-read:#25C48A; --seg-delivered:#1C8A66; --seg-sent:#4A5E56; --seg-failed:#E5675D;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1310; --surface:#111C18; --surface-2:#172420; --fg:#E7EFEB; --muted:#9BADA5; --line:#243630;
  --brand:#25C48A; --brand-strong:#4FD8A4; --brand-soft:#143328; --on-brand:#04180F;
  --wa-head:#1F2C34; --wa-head-fg:#E7EFEB; --bubble:#144D3F; --bubble-fg:#E7EFEB; --chat-bg:#0D1814; --chat-dot:#132520;
  --good:#4FD8A4; --good-soft:#143328; --warn:#F0B84A; --warn-soft:#3A2D10; --bad:#FF8A80; --bad-soft:#40201D; --on-bad:#2A0A08;
  --info:#86BDF5; --info-soft:#162B42; --focus:#8AB4F8;
  --seg-read:#25C48A; --seg-delivered:#1C8A66; --seg-sent:#4A5E56; --seg-failed:#E5675D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.55rem,4.2vw,2.05rem);font-weight:700}
h2{font-size:1.15rem;font-weight:650}
h3{font-size:1rem;font-weight:650}
p{margin:0}
a{color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.stack{display:grid;gap:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}.row.end{justify-content:flex-end}
.grow{flex:1 1 0;min-width:0}

/* shell */
.shell{display:grid;gap:16px;max-width:1280px;margin:0 auto}
.side{display:none}
main{min-width:0;display:grid;gap:20px;align-content:start;padding-bottom:96px}
@media(min-width:960px){
  .shell{grid-template-columns:240px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding:4px}
  main{padding-bottom:32px}
  .bottom{display:none!important}
}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--fg)}
.mark{width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-display);font-size:1.05rem;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;gap:12px;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:550}
.side nav a:hover{background:var(--surface)}
.side nav a[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:650}
.side-foot{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.mobhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(min-width:960px){.mobhead{display:none}}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;font-size:.72rem;font-weight:600;color:var(--muted);background:none;border:0;text-decoration:none;border-radius:12px;cursor:pointer}
.bottom [aria-current=page]{color:var(--brand)}
.bottom .fab span.disc{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 4px 14px rgba(11,122,98,.35)}
.bottom .fab{color:var(--fg)}

/* page */
.phead{display:flex;gap:14px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:4px;max-width:60ch}
.demo{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:.88rem}
.demo a{color:inherit;font-weight:650}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flush{padding:0;overflow:hidden}
.card>header,.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card.flush>.card-h{padding:16px 18px 0;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.lg{min-height:54px;font-size:1.05rem;padding:0 26px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn.bad:hover{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}

/* forms */
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:.88rem}
.in{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}
.in:focus{border-color:var(--brand)}
textarea.in{min-height:190px;resize:vertical;line-height:1.5}
.hint{font-size:.82rem;color:var(--muted)}
.err{font-size:.85rem;color:var(--bad);min-height:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;min-height:40px;cursor:pointer}
.check input,.gchk input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin-top:2px}
.check small{display:block;color:var(--muted)}
.formgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.emojis{display:flex;flex-wrap:wrap;gap:2px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.emojis button{width:40px;height:40px;border:0;background:transparent;font-size:1.3rem;border-radius:8px;cursor:pointer}
.emojis button:hover{background:var(--surface)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* stats & bars */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.stat b{display:block;font-family:var(--font-display);font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.stat span{font-size:.8rem;color:var(--muted)}
.cta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--brand);color:var(--on-brand);border-radius:20px;padding:20px}
.cta h2{font-size:1.35rem}.cta p{opacity:.9;margin-top:4px;max-width:44ch}
.cta .btn{background:var(--surface);color:var(--brand);border-color:transparent}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.prog{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog>div{height:100%;background:var(--brand);transition:width .3s}

/* lists */
.list{list-style:none;margin:0;padding:0}
.crow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"av main acts" ". meta meta";gap:4px 12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.crow .av{grid-area:av}.crow .main{grid-area:main;min-width:0}.crow .meta{grid-area:meta;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.crow .acts{grid-area:acts;display:flex}
.crow .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .main span{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:780px){
  .crow{grid-template-columns:40px minmax(0,1.2fr) minmax(0,1.3fr) auto;grid-template-areas:"av main meta acts"}
  .crow .meta{justify-content:flex-start}
}
.toolbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));padding:0 18px 14px}
.toolbar .wide{grid-column:1/-1}
@media(min-width:780px){.toolbar .wide{grid-column:span 2}}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cards .card{display:grid;gap:10px;align-content:start}
.tbody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.88rem;color:var(--muted);max-height:7.5em;overflow:hidden}

details.camp{border-top:1px solid var(--line)}
details.camp>summary{list-style:none;cursor:pointer;display:grid;gap:6px 12px;grid-template-columns:minmax(0,1fr) auto;padding:14px 18px;align-items:center}
details.camp>summary::-webkit-details-marker{display:none}
details.camp>summary .nm{min-width:0}
details.camp>summary .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.camp>summary .nm span{color:var(--muted);font-size:.85rem}
details.camp>summary .sc-row{grid-column:1/-1;display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
details.camp>summary .sc-row b{color:var(--fg);font-variant-numeric:tabular-nums}
details.camp[open]>summary{background:var(--surface-2)}
.cbody{padding:16px 18px 20px;display:grid;gap:16px;background:var(--surface-2)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini small{display:block;color:var(--muted);font-size:.78rem}
.mini b{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em}
code{background:var(--surface-2);padding:2px 6px;border-radius:6px;border:1px solid var(--line);overflow-wrap:anywhere}

/* composer */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{flex:1 1 140px;min-height:48px;display:flex;gap:10px;align-items:center;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.steps button i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.8rem;flex:none}
.steps button[aria-current=step]{color:var(--fg);border-color:var(--brand)}
.steps button[aria-current=step] i,.steps button.done i{background:var(--brand);color:var(--on-brand)}
.compose{display:grid;gap:20px;align-items:start}
.compose>*{min-width:0}
@media(min-width:1180px){.compose{grid-template-columns:minmax(0,1fr) 340px}.compose aside{position:sticky;top:16px}}
.phone{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--chat-bg);box-shadow:var(--shadow)}
.phone-head{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--wa-head);color:var(--wa-head-fg)}
.phone-head .av{width:34px;height:34px;background:rgba(255,255,255,.18);color:inherit}
.phone-head b{display:block;line-height:1.2}.phone-head small{opacity:.8}
.chat{padding:16px 12px 20px;min-height:220px;background-color:var(--chat-bg);background-image:radial-gradient(var(--chat-dot) 1.2px,transparent 1.4px);background-size:18px 18px}
.bubble{max-width:94%;margin-left:auto;background:var(--bubble);color:var(--bubble-fg);border-radius:12px 12px 3px 12px;padding:6px 8px 5px;box-shadow:0 1px 1px rgba(0,0,0,.14)}
.btext{padding:2px 4px;overflow-wrap:anywhere;font-size:.93rem}
.bmeta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:.7rem;opacity:.7;padding:0 2px}
.bubble img{display:block;width:100%;border-radius:8px;margin-bottom:4px}
.fileblk{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.07);border-radius:8px;padding:10px;margin-bottom:4px;font-size:.85rem;min-width:0}
.fileblk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpick{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.gchk{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;align-items:flex-start}
.gchk:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.gchk small{display:block;color:var(--muted)}
.plist{list-style:none;margin:8px 0 0;padding:0;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.plist li{border-bottom:1px solid var(--line);padding:0 12px}.plist li:last-child{border:0}
.plist .check{align-items:center}.plist .check>span:nth-child(2){flex:1;min-width:0}
.sum{display:grid;gap:0}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}.sum dt{color:var(--muted)}.sum dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.callout{padding:12px 14px;border-radius:12px;font-size:.9rem}
.callout.warn{background:var(--warn-soft);color:var(--warn)}.callout.info{background:var(--info-soft);color:var(--info)}.callout.bad{background:var(--bad-soft);color:var(--bad)}.callout.good{background:var(--good-soft);color:var(--good)}

/* modal, toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,15,11,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--fg);width:100%;max-width:580px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:760px}
.modal>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.mbody{padding:8px max(18px,env(safe-area-inset-right,0px)) 16px max(18px,env(safe-area-inset-left,0px));overflow:auto;display:grid;gap:14px}
.modal>footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
@media(min-width:640px){.scrim{align-items:center}.modal{border-radius:22px}}
.sheetnav{display:grid;gap:4px}

function normPhone(raw){
  let s=String(raw==null?'':raw).trim();
  if(!s)return{ok:false,error:'Enter a phone number.'};
  s=s.replace(/[\s\-().]/g,'');
  if(s.indexOf('00')===0)s='+'+s.slice(2);
  if(s[0]!=='+'){
    if(!/^\d+$/.test(s))return{ok:false,error:'Use digits only, with a country code such as +91.'};
    const cc=S.prefs.cc,d=s.replace(/^0+/,'');
    s=(d.indexOf(cc.slice(1))===0&&d.length>10)?'+'+d:cc+d;
  }
  if(!/^\+[1-9]\d{7,14}$/.test(s))return{ok:false,error:'That is not a valid number. Use a country code and 8 to 15 digits, for example +91 90000 11001.'};
  if(s.indexOf('+91')===0&&!/^\+91[6-9]\d{9}$/.test(s))return{ok:false,error:'Indian mobile numbers have 10 digits and start with 6, 7, 8 or 9.'};
  return{ok:true,e164:s};
}

const mroot=$('#modal-root');let lastFocus=null,pending=null;
function openModal(o){

function closeModal(val){

function copyText(text,btn){

/* ---------- recipients ---------- */
function resolveRecipients(d){
  const ids=new Set();
  S.contacts.forEach(c=>{if(c.groups.some(g=>d.groupIds.indexOf(g)>=0)||d.contactIds.indexOf(c.id)>=0)ids.add(c.id);});
  const seen=new Set(),sendable=[],excluded=[];
  Array.from(ids).map(cont).filter(Boolean).forEach(c=>{
    if(c.consent!=='opted_in'){excluded.push({c:c,reason:c.consent==='opted_out'?'Opted out':'Consent pending'});return;}
    if(seen.has(c.phone)){excluded.push({c:c,reason:'Duplicate number'});return;}
    seen.add(c.phone);sendable.push(c);
  });

/* import */
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;text=text.replace(/^﻿/,'');
  const delim=(text.split('\n')[0].match(/\t/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?'\t':',';
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];}
    else cell+=ch;
  }
  row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);return rows;
}
function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Excel support did not load. Save the sheet as CSV and import that instead.'));document.head.appendChild(s);});
}
function readRows(file){
  return new Promise((res,rej)=>{
    const ext=file.name.split('.').pop().toLowerCase(),fr=new FileReader();
    fr.onerror=()=>rej(new Error('That file could not be read.'));
    if(['csv','tsv','txt'].indexOf(ext)>=0){fr.onload=()=>res(parseCSV(String(fr.result)));fr.readAsText(file);}
    else if(['xlsx','xls'].indexOf(ext)>=0){
      loadXLSX().then(()=>{fr.onload=()=>{try{const wb=XLSX.read(fr.result,{type:'array'});res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}));}catch(e){rej(new Error('That workbook could not be read.'));}};fr.readAsArrayBuffer(file);},rej);
    }else rej(new Error('Choose a .csv, .xlsx or .xls file.'));
  });
}
function analyze(rows){
  if(!rows.length)return{valid:[],invalid:[],dupes:0,hasGroup:false};
  const h=rows[0].map(x=>String(x).toLowerCase());
  const hasHead=h.some(x=>/name|phone|mobile|whatsapp|number/.test(x));
  const find=re=>h.findIndex(x=>re.test(x));
  let iN=0,iP=1,iC=2,iG=3;
  if(hasHead){iN=find(/name/);iP=find(/phone|mobile|whatsapp|number|contact no/);iC=find(/company|business|organi/);iG=find(/group|tag|segment/);if(iN<0)iN=0;if(iP<0)iP=1;}
  const body=hasHead?rows.slice(1):rows;
  const seen=new Set(S.contacts.map(c=>c.phone)),valid=[],invalid=[];let dupes=0;
  body.forEach((r,i)=>{
    const name=String(r[iN]||'').trim(),p=normPhone(r[iP]);
    if(!name){invalid.push('Row '+(i+(hasHead?2:1))+': name is missing');return;}
    if(!p.ok){invalid.push('Row '+(i+(hasHead?2:1))+' ('+name+'): '+p.error);return;}
    if(seen.has(p.e164)){dupes++;return;}
    seen.add(p.e164);valid.push({name:name,phone:p.e164,company:iC>=0?String(r[iC]||'').trim():'',group:iG>=0?String(r[iG]||'').trim():''});
  });
  return{valid,invalid,dupes,hasGroup:iG>=0&&valid.some(v=>v.group)};
}

async function dedupe(){
  const gs=dupeGroups();if(!gs.length)return;
  const n=sum(gs,g=>g.length-1);
  const ok=await confirmDialog({title:'Remove duplicate numbers?',body:'<p>'+n+' duplicate contact'+(n===1?'':'s')+' will be merged into the earliest entry for each number. Their groups are combined. If any copy has opted out, the merged contact stays opted out.</p>',ok:'Remove duplicates'});
  if(!ok)return;
  const drop=new Set();
  gs.forEach(g=>{
    g.sort((a,b)=>(a.added||0)-(b.added||0));const keep=g[0];
    g.slice(1).forEach(d=>{d.groups.forEach(x=>{if(keep.groups.indexOf(x)<0)keep.groups.push(x);});if(d.consent==='opted_out')keep.consent='opted_out';else if(d.consent==='pending'&&keep.consent==='opted_in')keep.consent='pending';drop.add(d.id);});
  });
  S.contacts=S.contacts.filter(c=>!drop.has(c.id));save();toast(n+' duplicate'+(n===1?'':'s')+' removed','good');render();
}

const EMOJI=['👋','😊','🙏','🎉','🌟','✅','📢','🎁','🛒','📦','⏰','📅','❤️','👍','🔥','💬'];

function validateMedia(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(f.type.indexOf('image/')===0){if(['image/jpeg','image/png'].indexOf(f.type)<0)return{error:'WhatsApp accepts JPEG and PNG images.'};if(f.size>5*1048576)return{error:'Images can be up to 5 MB. This one is '+size(f.size)+'.'};return{kind:'image'};}
  if(f.type.indexOf('video/')===0){if(['video/mp4','video/3gpp'].indexOf(f.type)<0)return{error:'WhatsApp accepts MP4 and 3GPP videos.'};if(f.size>16*1048576)return{error:'Videos can be up to 16 MB. This one is '+size(f.size)+'.'};return{kind:'video'};}
  if(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt'].indexOf(ext)>=0){if(f.size>100*1048576)return{error:'Documents can be up to 100 MB.'};return{kind:'document'};}
  return{error:'This file type is not supported. Use JPEG, PNG, MP4, 3GPP, PDF, Office files or TXT.'};
}

function findDupe(list){
  if(!list.length)return null;const f=fingerprint(D.text,list.map(c=>c.phone));

}

/* simulated sending (stands in for the server queue) */
const runs={};
const ERRS=[{code:'131026',msg:'Message undeliverable. The number may not be on WhatsApp.'},{code:'131026',msg:'Message undeliverable. The number may not be on WhatsApp.'},{code:'131049',msg:'Not delivered to protect the quality of the messaging ecosystem.'}];
function startRunSim(cid,queueIn,failRate){
  const c=camp(cid);if(!c||runs[cid])return;
  const queue=queueIn?queueIn.slice():c.recipientIds.filter(id=>{const k=cont(id);return k&&k.consent==='opted_in';});
  if(!queueIn){
    const skipped=c.recipientIds.length-queue.length;c.recipientIds=queue.slice();
    c.stats={sent:0,delivered:0,read:0,failed:0};c.errors=[];c.failedIds=[];c.note=skipped?skipped+' contact'+(skipped===1?' was':'s were')+' removed because they opted out or were deleted.':'';
  }
  const per=Math.max(1,Math.round(S.prefs.rate/10)),fr=failRate==null?.07:failRate;let wait=0;
  const r=runs[cid]={timer:null};
  r.timer=setInterval(()=>{
    if(wait>0){wait--;return;}
    if(queue.length>per&&Math.random()<.05){c.note='Rate limit reached (130429). Pausing, then retrying with backoff.';wait=3;paint(c);return;}
    if(c.note.indexOf('Rate limit')===0)c.note='';
    for(let i=0;i<per&&queue.length;i++)simOne(c,queue.shift(),fr);
    paint(c);
    if(!queue.length){clearInterval(r.timer);delete runs[cid];finish(c);}
  },300);
  paint(c);
}
function simOne(c,id,fr){
  const s=c.stats;
  if(Math.random()<fr){s.failed++;c.failedIds.push(id);const e=pick(ERRS),x=c.errors.find(y=>y.code===e.code);if(x)x.count++;else c.errors.push({code:e.code,msg:e.msg,count:1});return;}
  s.sent++;const d=Math.random()<.93,rd=d&&Math.random()<.6;if(d)s.delivered++;if(rd)s.read++;
}
function paint(c){
  const done=c.stats.sent+c.stats.failed,tot=c.recipientIds.length||1,pct=Math.round(done/tot*100);
  $$('[data-live="'+c.id+'"]').forEach(el=>{const k=el.dataset.key;
    if(k==='bar'){el.style.width=pct+'%';const pb=el.parentNode;if(pb)pb.setAttribute('aria-valuenow',pct);}
    else if(k==='pct')el.textContent=pct+'%';else if(k==='note')el.textContent=c.note||'';else if(c.stats[k]!=null)el.textContent=c.stats[k];});
}
function finish(c){
  c.status=(c.stats.sent===0&&c.stats.failed>0)?'Failed':'Completed';c.completedAt=now();save();
  toast('"'+c.name+'" '+(c.status==='Completed'?'finished'+(c.source==='demo'?' (simulated)':''):'failed'),c.status==='Completed'?'good':'bad');
  const r=route();if(['broadcast','dashboard','history','scheduled'].indexOf(r)>=0&&!mroot.firstChild)render();
}
function retryFailed(id){
  const c=camp(id);if(!c||runs[id]||!c.failedIds.length)return;
  if((c.attempts||0)>=2){toast('Retry limit reached for this campaign.','bad');return;}
  const q=c.failedIds.filter(x=>{const k=cont(x);return k&&k.consent==='opted_in';});
  c.attempts=(c.attempts||0)+1;c.stats.failed=0;c.failedIds=[];c.errors=[];c.status='Sending';c.note='';save();
  if(!q.length){c.status='Completed';save();toast('Nobody left to retry. The remaining contacts opted out.');render();return;}
  startRun(id,q,.25);toast('Retrying '+q.length+' failed message'+(q.length===1?'':'s')+' (simulated)');render();
}
setInterval(()=>{
  if(!S.session.signedIn)return;
  S.campaigns.filter(c=>c.status==='Scheduled'&&c.scheduledFor&&c.scheduledFor<=now()&&!runs[c.id]).forEach(c=>{c.status='Sending';c.sentAt=now();c.scheduledFor=null;save();startRun(c.id);toast('Scheduled campaign "'+c.name+'" started');if(route()==='scheduled'||route()==='dashboard')render();});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const slug=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');

function waPayload(text,tid,k,vars,to){
  const t=tid&&S.templates.find(x=>x.id===tid);

    const comp=keys.length?[{type:'body',parameters:keys.map(key=>({type:'text',text:(fill('{{'+key+'}}',k,vars)||'-').replace(/\s*\n\s*/g,' ')}))}]:[];
    return{messaging_product:'whatsapp',to:to,type:'template',template:{name:slug(t.name),language:{code:WA().lang||'en_US'},components:comp}};}
  return{messaging_product:'whatsapp',to:to,type:'text',text:{preview_url:false,body:fill(text,k,vars)}};

async function waSend(payload){
  const W=WA();
  try{
    const r=await fetch('https://graph.facebook.com/'+W.ver+'/'+encodeURIComponent(W.phoneId)+'/messages',{method:'POST',headers:{'Authorization':'Bearer '+W.token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json().catch(()=>({}));

    const e=j.error||{};return{ok:false,code:String(e.code||r.status),msg:e.error_user_msg||e.message||('Request failed ('+r.status+')')};
  }catch(x){return{ok:false,code:'network',msg:'Could not reach Meta. If this page is hosted in a place that blocks outside requests, download the file and open it on your computer.'};}

function prepQueue(c,queueIn){
  const queue=queueIn?queueIn.slice():c.recipientIds.filter(id=>{const k=cont(id);return k&&k.consent==='opted_in';});
  if(!queueIn){const skipped=c.recipientIds.length-queue.length;c.recipientIds=queue.slice();
    c.stats={sent:0,delivered:0,read:0,failed:0};c.errors=[];c.failedIds=[];c.note=skipped?skipped+' contact'+(skipped===1?' was':'s were')+' removed because they opted out or were deleted.':'';}

function startRun(cid,queueIn,failRate){
  const c=camp(cid);if(!c||runs[cid])return;const m=WA().mode;c.source=m;

async function runApi(c,queue){
  const run=runs[c.id]={timer:null};const gap=Math.max(50,Math.round(1000/Math.max(1,S.prefs.rate)));const vars=(c.draft&&c.draft.vars)||{};const tid=c.draft&&c.draft.templateId;
  paint(c);let stopAll=null;
  while(queue.length){
    const id=queue.shift(),k=cont(id);if(!k)continue;
    if(stopAll){c.stats.failed++;c.failedIds.push(id);addErr(c,stopAll.code,stopAll.msg);continue;}
    let res=await waSend(waPayload(c.text,tid,k,vars,digits(k.phone)));
    if(!res.ok&&res.code==='130429'){c.note='Rate limit reached. Pausing, then retrying.';paint(c);await sleep(3000);c.note='';res=await waSend(waPayload(c.text,tid,k,vars,digits(k.phone)));}
    if(res.ok)c.stats.sent++;
    else{c.stats.failed++;c.failedIds.push(id);addErr(c,res.code,res.msg);if(res.code==='190'||res.code==='network'||res.code==='100'&&/phone number id|parameter/i.test(res.msg)&&c.stats.sent===0)stopAll=res;}
    paint(c);await sleep(gap);
  }
  delete runs[c.id];finish(c);
}

document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='auth-form'){
    const up=U.authMode==='up',err=$('#a-err'),em=$('#a-email').value.trim(),pw=$('#a-pass').value;

    if(pw.length<8){err.textContent='Use a password with at least 8 characters.';return;}
    if(up&&pw!==$('#a-pass2').value){err.textContent='The passwords do not match.';return;}
    if(up){S.user.name=$('#a-name').value.trim();S.user.business=$('#a-biz').value.trim()||S.user.business;}
    S.user.email=em;S.session.signedIn=true;save();location.hash='dashboard';render();toast(up?'Account created (demo)':'Signed in (demo)','good');
  }else if(f.id==='contact-form')submitContact(f);
  else if(f.id==='group-form'){
    const n=$('#g-name').value.trim(),id=f.dataset.id;if(!n){$('#g-err').textContent='Enter a group name.';return;}
    if(S.groups.some(g=>g.name.toLowerCase()===n.toLowerCase()&&g.id!==id)){$('#g-err').textContent='A group with this name already exists.';return;}
    if(id){const g=S.groups.find(x=>x.id===id);g.name=n;g.desc=$('#g-desc').value.trim();}else S.groups.push({id:uid('g'),name:n,desc:$('#g-desc').value.trim()});

  }else if(f.id==='tmpl-form'){
    const n=$('#t-name').value.trim(),b=$('#t-body').value.trim(),id=f.dataset.id,er=$('#t-err');
    if(!n){er.textContent='Enter a template name.';return;}if(!b){er.textContent='Enter the message body.';return;}if(b.length>1024){er.textContent='The body is over 1,024 characters.';return;}
    if(id){const t=S.templates.find(x=>x.id===id);t.name=n;t.category=$('#t-cat').value;if(t.body!==b){t.body=b;t.status='pending';}}else S.templates.push({id:uid('t'),name:n,category:$('#t-cat').value,status:'pending',body:b});
